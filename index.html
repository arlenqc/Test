<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Adventure Matcha — Premium Japanese matcha powders, chasen, and chawan. Step into the nature.">
  <title>Adventure Matcha — Step into the nature</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400&display=swap" rel="stylesheet">
  <style>
    /* ═══════════════════════════════════════════
       DESIGN TOKENS
    ═══════════════════════════════════════════ */
    :root {
      --charcoal: #595959;
      --grey: #7F7F7F;
      --silver: #A5A5A5;
      --dust-grey: #CCCCCC;
      --platinum: #F2F2F2;
      --dark: #141414;
      --darker: #0D0D0D;
      --green: #00FF88;
      --green-dim: #00DD77;
      --green-glow: rgba(0, 255, 136, 0.15);
      --green-glow-strong: rgba(0, 255, 136, 0.3);
      --font-display: 'Cormorant Garamond', 'Georgia', serif;
      --font-body: 'DM Sans', 'Helvetica Neue', sans-serif;
      --nav-height: 72px;
      --section-pad: clamp(80px, 10vw, 160px);
      --container-max: 1280px;
      --radius-sm: 4px;
      --radius-md: 8px;
      --radius-lg: 16px;
      --transition: 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      --transition-fast: 0.25s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    /* ═══════════════════════════════════════════
       RESET & BASE
    ═══════════════════════════════════════════ */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
    body {
      font-family: var(--font-body);
      font-weight: 400;
      color: var(--charcoal);
      background: var(--platinum);
      line-height: 1.7;
      overflow-x: hidden;
    }
    img { display: block; max-width: 100%; height: auto; }
    a { color: inherit; text-decoration: none; }
    button { cursor: pointer; border: none; background: none; font-family: inherit; }
    ul, ol { list-style: none; }
    input, textarea, select { font-family: inherit; font-size: inherit; }
    ::selection { background: var(--green); color: var(--dark); }

    /* Noise texture overlay */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9999;
      opacity: 0.025;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-repeat: repeat;
      background-size: 180px;
    }

    /* ═══════════════════════════════════════════
       TYPOGRAPHY
    ═══════════════════════════════════════════ */
    h1, h2, h3, h4, h5, h6 { font-family: var(--font-display); font-weight: 400; line-height: 1.15; }
    .heading-xl { font-size: clamp(2.8rem, 6vw, 5.5rem); letter-spacing: -0.02em; }
    .heading-lg { font-size: clamp(2rem, 4vw, 3.5rem); letter-spacing: -0.015em; }
    .heading-md { font-size: clamp(1.5rem, 2.5vw, 2.2rem); letter-spacing: -0.01em; }
    .heading-sm { font-size: clamp(1.1rem, 1.5vw, 1.4rem); }
    .label {
      font-family: var(--font-body);
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--silver);
    }
    .label--green { color: var(--green); }
    .text-lead { font-size: clamp(1rem, 1.3vw, 1.2rem); color: var(--grey); font-weight: 300; line-height: 1.8; }
    .text-sm { font-size: 0.875rem; color: var(--grey); }
    .text-italic { font-family: var(--font-display); font-style: italic; font-weight: 300; }

    /* ═══════════════════════════════════════════
       UTILITIES
    ═══════════════════════════════════════════ */
    .container { max-width: var(--container-max); margin: 0 auto; padding: 0 clamp(20px, 4vw, 48px); }
    .section { padding: var(--section-pad) 0; position: relative; }
    .section--dark { background: var(--dark); color: var(--platinum); }
    .section--dark .text-lead,
    .section--dark .text-sm { color: var(--silver); }
    .section--dark .label { color: var(--dust-grey); }
    .divider { width: 60px; height: 1px; background: var(--dust-grey); margin: 24px 0; }
    .divider--green { background: var(--green); width: 40px; }
    .divider--center { margin-left: auto; margin-right: auto; }

    /* Scroll reveal */
    .reveal {
      opacity: 0;
      transform: translateY(32px);
      transition: opacity 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94), transform 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }
    .reveal.revealed { opacity: 1; transform: translateY(0); }
    .reveal-delay-1 { transition-delay: 0.1s; }
    .reveal-delay-2 { transition-delay: 0.2s; }
    .reveal-delay-3 { transition-delay: 0.3s; }
    .reveal-delay-4 { transition-delay: 0.4s; }
    .reveal-delay-5 { transition-delay: 0.5s; }

    @media (prefers-reduced-motion: reduce) {
      .reveal { opacity: 1; transform: none; transition: none; }
      .hero__slide { animation: none !important; }
      .hero__slide:first-child { opacity: 1; }
    }

    /* Page visibility */
    .page { display: none; }
    .page.active { display: block; }

    /* ═══════════════════════════════════════════
       NAVIGATION
    ═══════════════════════════════════════════ */
    .nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: var(--nav-height);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 clamp(20px, 4vw, 48px);
      transition: background var(--transition), box-shadow var(--transition);
    }
    .nav.scrolled {
      background: rgba(20, 20, 20, 0.95);
      backdrop-filter: blur(12px);
      box-shadow: 0 1px 0 rgba(255,255,255,0.05);
    }
    .nav__logo {
      font-family: var(--font-display);
      font-size: 1.35rem;
      font-weight: 500;
      color: #fff;
      letter-spacing: 0.02em;
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 1001;
    }
    .nav__logo-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 12px var(--green-glow-strong);
    }

    /* Hamburger */
    .hamburger {
      width: 32px;
      height: 24px;
      position: relative;
      z-index: 1001;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .hamburger span {
      display: block;
      height: 1.5px;
      background: #fff;
      border-radius: 2px;
      transition: transform var(--transition-fast), opacity var(--transition-fast);
      transform-origin: center;
    }
    .hamburger.open span:nth-child(1) { transform: translateY(11.25px) rotate(45deg); }
    .hamburger.open span:nth-child(2) { opacity: 0; }
    .hamburger.open span:nth-child(3) { transform: translateY(-11.25px) rotate(-45deg); }

    /* Mobile menu overlay */
    .nav-menu {
      position: fixed;
      inset: 0;
      background: var(--dark);
      z-index: 999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 0;
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--transition);
    }
    .nav-menu.open { opacity: 1; pointer-events: all; }
    .nav-menu a {
      font-family: var(--font-display);
      font-size: clamp(2rem, 5vw, 3.5rem);
      color: var(--platinum);
      padding: 16px 0;
      position: relative;
      transition: color var(--transition-fast);
      display: block;
    }
    .nav-menu a::after {
      content: '';
      position: absolute;
      bottom: 10px;
      left: 50%;
      width: 0;
      height: 1.5px;
      background: var(--green);
      transition: width var(--transition), left var(--transition);
    }
    .nav-menu a:hover { color: var(--green); }
    .nav-menu a:hover::after { width: 100%; left: 0; }
    .nav-menu__footer {
      position: absolute;
      bottom: 48px;
      text-align: center;
    }
    .nav-menu__footer .label { margin-bottom: 16px; display: block; }
    .nav-menu__social { display: flex; gap: 24px; justify-content: center; }
    .nav-menu__social a {
      font-size: 0.875rem;
      color: var(--silver);
      padding: 0;
      transition: color var(--transition-fast);
    }
    .nav-menu__social a::after { display: none; }
    .nav-menu__social a:hover { color: var(--green); }

    /* ═══════════════════════════════════════════
       HERO SLIDER
    ═══════════════════════════════════════════ */
    .hero {
      position: relative;
      width: 100%;
      height: 100vh;
      min-height: 600px;
      overflow: hidden;
      background: var(--dark);
    }
    .hero__slide {
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 1.2s ease;
    }
    .hero__slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: brightness(0.45) saturate(0.7);
    }
    .hero__slide-content {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 0 clamp(20px, 6vw, 80px);
      padding-top: var(--nav-height);
    }
    .hero__slide-label {
      margin-bottom: 20px;
    }
    .hero__slide-title {
      color: #fff;
      max-width: 700px;
      margin-bottom: 20px;
    }
    .hero__slide-desc {
      color: rgba(255,255,255,0.6);
      max-width: 480px;
      font-weight: 300;
      margin-bottom: 36px;
    }
    .hero__cta {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      color: var(--green);
      font-size: 0.8rem;
      font-weight: 500;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      transition: gap var(--transition-fast);
    }
    .hero__cta:hover { gap: 20px; }
    .hero__cta svg { width: 18px; height: 18px; }

    /* Slider controls */
    .hero__dots {
      position: absolute;
      bottom: 40px;
      left: clamp(20px, 6vw, 80px);
      display: flex;
      gap: 12px;
      z-index: 10;
    }
    .hero__dot {
      width: 32px;
      height: 2px;
      background: rgba(255,255,255,0.25);
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: background var(--transition-fast);
    }
    .hero__dot.active { background: rgba(255,255,255,0.25); }
    .hero__dot.active::after {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      width: 0;
      background: var(--green);
      animation: dotProgress 5s linear forwards;
    }
    @keyframes dotProgress {
      0% { width: 0; }
      100% { width: 100%; }
    }
    .hero__counter {
      position: absolute;
      bottom: 40px;
      right: clamp(20px, 6vw, 80px);
      color: rgba(255,255,255,0.4);
      font-size: 0.8rem;
      font-weight: 300;
      letter-spacing: 0.1em;
      z-index: 10;
    }
    .hero__counter span { color: var(--green); }

    /* ═══════════════════════════════════════════
       BUTTONS
    ═══════════════════════════════════════════ */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px 32px;
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      border-radius: var(--radius-sm);
      transition: all var(--transition-fast);
    }
    .btn--primary {
      background: var(--green);
      color: var(--dark);
    }
    .btn--primary:hover { background: var(--green-dim); box-shadow: 0 4px 24px var(--green-glow); transform: translateY(-1px); }
    .btn--outline {
      border: 1px solid var(--dust-grey);
      color: var(--charcoal);
    }
    .btn--outline:hover { border-color: var(--green); color: var(--green); }
    .btn--outline-white {
      border: 1px solid rgba(255,255,255,0.2);
      color: var(--platinum);
    }
    .btn--outline-white:hover { border-color: var(--green); color: var(--green); }
    .btn--small { padding: 10px 20px; font-size: 0.7rem; }
    .btn svg { width: 14px; height: 14px; }

    /* ═══════════════════════════════════════════
       CARDS
    ═══════════════════════════════════════════ */
    .card {
      background: #fff;
      border-radius: var(--radius-md);
      overflow: hidden;
      transition: transform var(--transition), box-shadow var(--transition);
    }
    .card:hover { transform: translateY(-4px); box-shadow: 0 16px 48px rgba(0,0,0,0.08); }
    .card__img {
      position: relative;
      overflow: hidden;
      aspect-ratio: 1 / 1;
      background: var(--platinum);
    }
    .card__img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }
    .card:hover .card__img img { transform: scale(1.05); }
    .card__badge {
      position: absolute;
      top: 14px;
      left: 14px;
      background: rgba(20,20,20,0.8);
      backdrop-filter: blur(8px);
      color: var(--platinum);
      font-size: 0.6rem;
      font-weight: 500;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      padding: 5px 10px;
      border-radius: var(--radius-sm);
    }
    .card__body { padding: 20px; }
    .card__name {
      font-family: var(--font-display);
      font-size: 1.2rem;
      font-weight: 500;
      margin-bottom: 6px;
      color: var(--dark);
    }
    .card__desc {
      font-size: 0.82rem;
      color: var(--grey);
      font-weight: 300;
      line-height: 1.6;
      margin-bottom: 16px;
    }
    .card__footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .card__price {
      font-family: var(--font-display);
      font-size: 1.15rem;
      font-weight: 600;
      color: var(--dark);
    }
    .card__add {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid var(--dust-grey);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all var(--transition-fast);
      color: var(--grey);
    }
    .card__add:hover { border-color: var(--green); background: var(--green); color: var(--dark); }
    .card__add svg { width: 14px; height: 14px; }

    /* Product grid */
    .product-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 28px;
    }
    @media (max-width: 900px) { .product-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 560px) { .product-grid { grid-template-columns: 1fr; max-width: 380px; margin: 0 auto; } }

    /* Category card (larger) */
    .cat-card {
      position: relative;
      border-radius: var(--radius-lg);
      overflow: hidden;
      aspect-ratio: 4 / 5;
      cursor: pointer;
      display: block;
    }
    .cat-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: brightness(0.5) saturate(0.6);
      transition: all 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }
    .cat-card:hover img { filter: brightness(0.6) saturate(0.8); transform: scale(1.05); }
    .cat-card__content {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 36px;
    }
    .cat-card__title {
      font-family: var(--font-display);
      font-size: clamp(1.5rem, 2.5vw, 2rem);
      color: #fff;
      margin-bottom: 8px;
    }
    .cat-card__count {
      font-size: 0.75rem;
      color: rgba(255,255,255,0.5);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    .cat-card__line {
      width: 40px;
      height: 1.5px;
      background: var(--green);
      margin-bottom: 16px;
      transition: width var(--transition);
    }
    .cat-card:hover .cat-card__line { width: 80px; }

    /* ═══════════════════════════════════════════
       FILTER TABS
    ═══════════════════════════════════════════ */
    .filter-tabs {
      display: flex;
      gap: 0;
      border-bottom: 1px solid var(--dust-grey);
      margin-bottom: 48px;
      overflow-x: auto;
    }
    .filter-tab {
      padding: 16px 28px;
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--silver);
      position: relative;
      white-space: nowrap;
      transition: color var(--transition-fast);
      background: none;
      border: none;
      cursor: pointer;
    }
    .filter-tab::after {
      content: '';
      position: absolute;
      bottom: -1px;
      left: 0;
      width: 100%;
      height: 2px;
      background: var(--green);
      transform: scaleX(0);
      transform-origin: left;
      transition: transform var(--transition);
    }
    .filter-tab:hover { color: var(--charcoal); }
    .filter-tab.active { color: var(--charcoal); }
    .filter-tab.active::after { transform: scaleX(1); }

    /* ═══════════════════════════════════════════
       FORMS
    ═══════════════════════════════════════════ */
    .form-group { margin-bottom: 32px; position: relative; }
    .form-label {
      display: block;
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--silver);
      margin-bottom: 10px;
    }
    .form-input,
    .form-textarea {
      width: 100%;
      padding: 12px 0;
      font-size: 1rem;
      font-weight: 300;
      color: var(--dark);
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--dust-grey);
      outline: none;
      transition: border-color var(--transition-fast);
    }
    .form-textarea { resize: vertical; min-height: 120px; }
    .form-input:focus,
    .form-textarea:focus { border-bottom-color: var(--green); }
    .form-input.error,
    .form-textarea.error { border-bottom-color: #ff4444; }
    .form-error {
      font-size: 0.72rem;
      color: #ff4444;
      margin-top: 6px;
      display: none;
    }
    .form-error.visible { display: block; }
    .form-success {
      display: none;
      padding: 24px;
      background: var(--green-glow);
      border-left: 3px solid var(--green);
      border-radius: var(--radius-sm);
      color: var(--dark);
      font-size: 0.9rem;
    }
    .form-success.visible { display: block; }

    /* ═══════════════════════════════════════════
       ACCORDION (FAQ) — CSS-only checkbox hack
    ═══════════════════════════════════════════ */
    .accordion { border-top: 1px solid var(--dust-grey); }
    .accordion__item { border-bottom: 1px solid var(--dust-grey); }
    .accordion__input { display: none; }
    .accordion__label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 0;
      cursor: pointer;
      font-family: var(--font-display);
      font-size: 1.15rem;
      font-weight: 500;
      color: var(--charcoal);
      transition: color var(--transition-fast);
      user-select: none;
    }
    .accordion__label:hover { color: var(--dark); }
    .accordion__icon {
      width: 20px;
      height: 20px;
      position: relative;
      flex-shrink: 0;
      margin-left: 16px;
    }
    .accordion__icon::before,
    .accordion__icon::after {
      content: '';
      position: absolute;
      background: var(--silver);
      transition: transform var(--transition), background var(--transition-fast);
    }
    .accordion__icon::before { width: 100%; height: 1.5px; top: 50%; transform: translateY(-50%); }
    .accordion__icon::after { width: 1.5px; height: 100%; left: 50%; transform: translateX(-50%); }
    .accordion__co
